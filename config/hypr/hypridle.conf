general {
    lock_cmd = ctxos-system-lock                         # lock screen and 1password
    before_sleep_cmd = CTXOS_LOCK_ONLY=true ctxos-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && ctxos-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || ctxos-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = ctxos-system-lock
    on-resume = ctxos-system-wake
}
